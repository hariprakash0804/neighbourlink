<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    
    <!-- Map Pin Inner Gradient -->
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Drop Shadow for Pin -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bg-grad)" />

  <!-- Suburban Roofline Accent -->
  <path d="M160 270 L256 190 L352 270" stroke="rgba(255, 255, 255, 0.4)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Main Map Pin -->
  <path d="M256 116 C194.14 116 144 166.14 144 228 C144 312 256 392 256 392 C256 392 368 312 368 228 C368 166.14 317.86 116 256 116 Z" fill="url(#pin-grad)" filter="url(#drop-shadow)" />

  <!-- Core Community Pin Eye -->
  <circle cx="256" cy="220" r="44" fill="#6366F1" />

  <!-- Connected Status Green Badge -->
  <circle cx="368" cy="368" r="48" fill="#10B981" stroke="#FFFFFF" stroke-width="16" />
</svg>
